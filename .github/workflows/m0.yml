name: M0 logic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Campaign fixed-seed regression
        if: github.event_name == 'pull_request'
        run: node scripts/roguelite-sim.mjs
